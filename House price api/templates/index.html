<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 50px;
            background: linear-gradient(to bottom, #fff, #ffe5d0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="number"] {
            padding: 10px;
            width: calc(100% - 22px);
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #ff5a47;
        }
        .result {
            font-size: 1.2em;
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            background-color: #ffe5d0;
            color: #333;
            display: inline-block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>House Price Prediction</h1>
        <form method="POST">
            <label for="house_size">Enter House Size (sq ft):</label>
            <input type="number" id="house_size" name="house_size" required>
            <input type="submit" value="Predict Price">
        </form>
        {% if prediction is not none %}
            <div class="result">
                {% if prediction is string %}
                    {{ prediction }}
                {% else %}
                    Predicted Price: ${{ '{:,.2f}'.format(prediction) }}
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
